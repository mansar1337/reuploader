name: Reupload to Pixeldrain

# Ручной запуск: вводишь ссылку на файл, workflow скачивает его через aria2c
# и заливает на pixeldrain, в конце публикует ссылку на перезалитый файл.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Ссылка на файл для скачивания"
        required: true
        type: string
      filename:
        description: "Имя файла на pixeldrain (необязательно, иначе будет взято из URL/заголовков)"
        required: false
        type: string
      aria2_extra_args:
        description: "Доп. аргументы для aria2c (например: заголовки, кол-во соединений)"
        required: false
        type: string
        default: "-x16 -s16 -k1M"

# На случай если кто-то захочет вызывать workflow программно через API
# (repository_dispatch), можно раскомментировать блок ниже.
# on:
#   repository_dispatch:
#     types: [reupload]

jobs:
  reupload:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # запас под большие файлы (лимит job'а GitHub Actions - 6 часов на free)

    env:
      PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
      SRC_URL: ${{ github.event.inputs.url }}
      DST_NAME: ${{ github.event.inputs.filename }}
      ARIA2_ARGS: ${{ github.event.inputs.aria2_extra_args }}

    steps:
      - name: Проверка наличия API-ключа
        run: |
          if [ -z "$PIXELDRAIN_API_KEY" ]; then
            echo "::error::Секрет PIXELDRAIN_API_KEY не задан. Добавь его в Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Установка aria2 и jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 jq curl

      - name: Подготовка рабочей директории
        run: mkdir -p "$GITHUB_WORKSPACE/download"

      - name: Скачивание файла через aria2c
        id: download
        working-directory: ${{ github.workspace }}/download
        run: |
          set -euo pipefail

          # Если указано конкретное имя файла - используем его как -o для aria2c
          NAME_ARG=()
          if [ -n "$DST_NAME" ]; then
            NAME_ARG=(-o "$DST_NAME")
          fi

          echo "Скачиваю: $SRC_URL"
          aria2c \
            $ARIA2_ARGS \
            --max-tries=5 \
            --retry-wait=5 \
            --continue=true \
            --console-log-level=warn \
            --summary-interval=30 \
            --dir="$PWD" \
            "${NAME_ARG[@]}" \
            "$SRC_URL"

          # Находим скачанный файл (первый и единственный файл в директории)
          FILE_PATH=$(find "$PWD" -maxdepth 1 -type f ! -name '*.aria2' | head -n1)

          if [ -z "$FILE_PATH" ]; then
            echo "::error::Файл не был скачан"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$FILE_PATH")
          FILE_NAME=$(basename "$FILE_PATH")

          echo "Скачан файл: $FILE_NAME ($FILE_SIZE байт)"

          {
            echo "file_path=$FILE_PATH"
            echo "file_name=$FILE_NAME"
            echo "file_size=$FILE_SIZE"
          } >> "$GITHUB_OUTPUT"

      - name: Загрузка файла на pixeldrain
        id: upload
        run: |
          set -euo pipefail

          FILE_PATH="${{ steps.download.outputs.file_path }}"
          FILE_NAME="${{ steps.download.outputs.file_name }}"

          # URL-кодируем имя файла для подстановки в путь запроса
          ENCODED_NAME=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FILE_NAME")

          echo "Заливаю $FILE_NAME на pixeldrain..."

          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X PUT \
            -T "$FILE_PATH" \
            -u ":$PIXELDRAIN_API_KEY" \
            "https://pixeldrain.com/api/file/${ENCODED_NAME}")

          echo "HTTP статус: $HTTP_CODE"
          cat response.json

          SUCCESS=$(jq -r '.success' response.json 2>/dev/null || echo "false")

          if [ "$HTTP_CODE" -ge 400 ] || [ "$SUCCESS" != "true" ]; then
            echo "::error::Ошибка загрузки на pixeldrain: $(cat response.json)"
            exit 1
          fi

          FILE_ID=$(jq -r '.id' response.json)
          PIXELDRAIN_URL="https://pixeldrain.com/u/${FILE_ID}"
          DIRECT_URL="https://pixeldrain.com/api/file/${FILE_ID}"

          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          echo "pixeldrain_url=$PIXELDRAIN_URL" >> "$GITHUB_OUTPUT"
          echo "direct_url=$DIRECT_URL" >> "$GITHUB_OUTPUT"

      - name: Итог
        run: |
          echo "### ✅ Файл перезалит на pixeldrain" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Имя файла:** ${{ steps.download.outputs.file_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Размер:** ${{ steps.download.outputs.file_size }} байт" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ссылка (страница):** ${{ steps.upload.outputs.pixeldrain_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Прямая ссылка (скачивание):** ${{ steps.upload.outputs.direct_url }}" >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "=============================================="
          echo "Ссылка на файл: ${{ steps.upload.outputs.pixeldrain_url }}"
          echo "Прямая ссылка:  ${{ steps.upload.outputs.direct_url }}"
          echo "=============================================="

      - name: Очистка
        if: always()
        run: rm -rf "${{ github.workspace }}/download"
