name: Telegram Reuploader Bot

# Запускаешь workflow вручную -> бот поднимается и слушает Telegram.
# Открываешь чат с ботом, присылаешь ссылку на файл -> бот спрашивает,
# куда залить (VikingFile / Pixeldrain), затем показывает прогресс скачивания
# и загрузки с кнопками "Пауза" / "Стоп", в конце присылает ссылку.
#
# Если бот не получает сообщений дольше idle_timeout_minutes - job завершается
# сам, чтобы не тратить впустую минуты Actions.
on:
  workflow_dispatch:
    inputs:
      idle_timeout_minutes:
        description: "Через сколько минут без сообщений бот завершится"
        required: false
        type: string
        default: "10"
      pixeldrain_max_size_gb:
        description: "Лимит размера файла для кнопки Pixeldrain (ГБ)"
        required: false
        type: string
        default: "20"

# Если запустить workflow ещё раз, пока предыдущий бот ещё работает,
# GitHub автоматически отменит старый запуск - это предотвращает конфликт
# "Conflict: terminated by other getUpdates request" между двумя ботами.
concurrency:
  group: telegram-reuploader-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # общий потолок job'а (лимит free-раннера - 6 часов)

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
      VIKINGFILE_USER_HASH: ${{ secrets.VIKINGFILE_USER_HASH }}
      PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
      FUCKINGFAST_TOKEN: ${{ secrets.FUCKINGFAST_TOKEN }}
      BUZZHEAVIER_TOKEN: ${{ secrets.BUZZHEAVIER_TOKEN }}
      GOFILE_API_TOKEN: ${{ secrets.GOFILE_API_TOKEN }}
      IDLE_TIMEOUT_MINUTES: ${{ github.event.inputs.idle_timeout_minutes }}
      PIXELDRAIN_MAX_SIZE_GB: ${{ github.event.inputs.pixeldrain_max_size_gb }}
      HARD_TIMEOUT_SECONDS: 20400   # ~340 минут, чуть меньше timeout-minutes выше

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверка секретов
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Секрет TELEGRAM_BOT_TOKEN не задан"
            exit 1
          fi
          if [ -z "$TELEGRAM_ALLOWED_CHAT_IDS" ]; then
            echo "::warning::Секрет TELEGRAM_ALLOWED_CHAT_IDS не задан - ботом сможет пользоваться кто угодно, кто его найдёт."
          fi
          if [ -z "$VIKINGFILE_USER_HASH" ]; then
            echo "::notice::VIKINGFILE_USER_HASH не задан - на VikingFile файлы будут заливаться анонимно."
          fi
          if [ -z "$PIXELDRAIN_API_KEY" ]; then
            echo "::notice::PIXELDRAIN_API_KEY не задан - опция Pixeldrain в боте будет недоступна."
          fi
          # FuckingFast, BuzzHeavier и Gofile поддерживают анонимную загрузку,
          # поэтому FUCKINGFAST_TOKEN / BUZZHEAVIER_TOKEN / GOFILE_API_TOKEN не обязательны -
          # без них файлы просто не будут привязаны к аккаунту.

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 python3 python3-pip

      - name: Установка Python-зависимостей
        run: pip install --no-cache-dir requests requests-toolbelt

      - name: Запуск бота
        run: python3 scripts/reuploader_bot.py
