name: Telegram VikingFile Bot

# Запускаешь workflow вручную -> бот поднимается и слушает Telegram.
# Открываешь чат с ботом, присылаешь ссылку на файл -> бот показывает прогресс
# скачивания (aria2c) и загрузки (VikingFile), в конце присылает ссылку.
#
# Если бот не получает сообщений дольше idle_timeout_minutes - job завершается
# сам, чтобы не тратить впустую минуты Actions.
on:
  workflow_dispatch:
    inputs:
      idle_timeout_minutes:
        description: "Через сколько минут без сообщений бот завершится"
        required: false
        type: string
        default: "10"

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # общий потолок job'а (лимит free-раннера - 6 часов)

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
      VIKINGFILE_USER_HASH: ${{ secrets.VIKINGFILE_USER_HASH }}
      IDLE_TIMEOUT_MINUTES: ${{ github.event.inputs.idle_timeout_minutes }}
      HARD_TIMEOUT_SECONDS: 20400   # ~340 минут, чуть меньше timeout-minutes выше

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверка секретов
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Секрет TELEGRAM_BOT_TOKEN не задан"
            exit 1
          fi
          if [ -z "$TELEGRAM_ALLOWED_CHAT_IDS" ]; then
            echo "::warning::Секрет TELEGRAM_ALLOWED_CHAT_IDS не задан - ботом сможет пользоваться кто угодно, кто его найдёт. Рекомендуется задать свой chat_id."
          fi
          if [ -z "$VIKINGFILE_USER_HASH" ]; then
            echo "::notice::VIKINGFILE_USER_HASH не задан - файлы будут загружаться анонимно (без привязки к аккаунту)."
          fi

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aria2 python3 python3-pip

      - name: Установка Python-зависимостей
        run: pip install --no-cache-dir requests requests-toolbelt

      - name: Запуск бота
        run: python3 scripts/vikingfile_bot.py
